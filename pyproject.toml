[project]
name = "finance-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.9.4",
    "asyncpg>=0.31.0",
    "fastapi[all]>=0.139.2",
    "mftool==3.3",
    "psycopg>=3.3.4",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pytest>=9.1.1",
    "pytest-databases>=0.19.0",
    "python-dotenv==1.2.2",
    "ruff>=0.16.0",
    "scalene>=2.3.0",
    "sqlalchemy==2.0.51",
    "tqdm>=4.68.4",
    "uliweb-alembic>=0.6.9",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
test = [
    "httpx2>=2.9.1",
    "hypothesis>=6.163.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = ['--cov=.', '--cov-report=term-missing', '--cov-branch', '--cov-fail-under=80', '-p', 'no:warnings']
env_file = [
    ".env.test"
]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "tests/*",
    ".venv/*",
    "__init__.py"
]
