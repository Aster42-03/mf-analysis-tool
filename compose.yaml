services:
  db:
    image: postgres:18.4-alpine3.24
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  seeder:
    build: .
    env_file:
      - .env
    volumes:
      - ./scripts:/usr/src/scripts
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    command: sh -c "uv run python scripts/get_Fund_Index.py && uv run python scripts/get_Nav.py"


  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./app
          target: /usr/src/app
          initial_sync: true
    depends_on:
      - db

volumes:
  postgres_data: